<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Links</title>
</head>
<body>

  <ul>
    <li><a href="https://google.com" title="Search the web">Google</a></li>
    <li><a href="https://github.com" title="Code repository">GitHub</a></li>
    <li><a href="https://youtube.com" title="Watch videos">YouTube</a></li>
  </ul>

  <script>
    if (location.hash) {
      const pos = parseInt(location.hash.slice(1));
      if (!isNaN(pos)) window.scrollTo(0, pos);
    }

    window.addEventListener('scroll', () => {
      if (window.scrollY > 0) {
        history.replaceState(null, '', '#' + window.scrollY);
      } else {
        history.replaceState(null, '', location.pathname);
      }
    });
  </script>

</body>
</html>

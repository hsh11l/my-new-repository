<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Links</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      padding: 16px;
      background: #f5f5f5;
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    li a {
      display: block;
      padding: 14px 16px;
      background: white;
      border-radius: 10px;
      text-decoration: none;
      color: #333;
      font-size: 1rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      /* Bigger tap area for mobile */
      min-height: 48px;
    }

    li a:hover {
      background: #e8e8e8;
    }
  </style>
</head>
<body>

  <ul>
    <li><a href="https://google.com" title="Search the web">Google</a></li>
    <li><a href="https://github.com" title="Code repository">GitHub</a></li>
    <li><a href="https://youtube.com" title="Watch videos">YouTube</a></li>
  </ul>

  <script>
    if (location.hash) {
      const pos = parseInt(location.hash.slice(1));
      if (!isNaN(pos)) window.scrollTo(0, pos);
    }

    window.addEventListener('scroll', () => {
      if (window.scrollY > 0) {
        history.replaceState(null, '', '#' + window.scrollY);
      } else {
        history.replaceState(null, '', location.pathname);
      }
    });
  </script>

</body>
</html>
